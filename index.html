      rel="stylesheet"
    />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('tss-theme-pref');
          const pref = stored === 'light' || stored === 'dark' || stored === 'device' ? stored : 'device';
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          const resolved = pref === 'device' ? (prefersDark ? 'dark' : 'light') : pref;
          document.documentElement.setAttribute('data-theme-pref', pref);
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.classList.toggle('dark', resolved === 'dark');
        } catch {
          document.documentElement.setAttribute('data-theme-pref', 'device');
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
